<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<div class="main-content">

<div class="table-box">

<h2>Change Password</h2>

{% if error %}
<p style="color:red;">
{{ error }}
</p>
{% endif %}

{% if success %}
<p style="color:lightgreen;">
{{ success }}
</p>
{% endif %}

<form method="POST">

<label>Current Password</label>

<input
type="password"
name="current_password"
required>

<br><br>

<label>New Password</label>

<input
type="password"
name="new_password"
required>

<br><br>

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
required>

<br><br>

<button type="submit" class="btn">
Change Password
</button>

</form>

<br>

<a href="/profile" class="btn">
Back
</a>

</div>

</div>

</div>

</body>

</html>
