<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CyberShield</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="cyber-body">

<div class="cyber-grid"></div>

<div class="login-container">

    <div class="login-box">

       <div class="logo-center">

    🛡

</div>

<h1 class="cyber-title">

    CyberShield

</h1>

        {% if error %}

        <div class="alert-box">

            {{ error }}

        </div>

        {% endif %}

        <form method="POST" action="/login">

            <input
            type="text"
            name="username"
            placeholder="Username"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <button
            type="submit"
            class="login-btn">

                ACCESS SYSTEM

            </button>

        </form>

    </div>

</div>

</body>
</html>
